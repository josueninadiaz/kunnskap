<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plataforma educativa gratuita y de código abierto para aprender programación, desarrollo de software, inteligencia artificial y ciberseguridad." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070d15" media="(prefers-color-scheme: dark)" />
    <title>%VITE_PLATFORM_NAME%</title>
    <!-- Aplica el tema y las preferencias de lectura antes del primer pintado (sin destellos ni saltos). -->
    <script>
      try {
        var t = localStorage.getItem('kunnskap.theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        var p = JSON.parse(localStorage.getItem('kunnskap.preferencias') || '{}')
        var d = { text: 'normal', spacing: 'normal', font: 'estandar', motion: 'sistema', links: 'normal' }
        for (var k in d) if (typeof p[k] === 'string' && p[k] !== d[k]) document.documentElement.setAttribute('data-' + k, p[k])
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
