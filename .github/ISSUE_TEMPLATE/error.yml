name: Informar de un error
description: Algo no funciona como debería en la plataforma.
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisarnos. **Si se trata de un problema de seguridad, no lo publiques aquí**: consulta SECURITY.md.
        No incluyas contraseñas ni datos personales.
  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: Describe el problema con tus palabras.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Entra en…
        2. Pulsa…
        3. Aparece…
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Dispositivo y navegador
      placeholder: "Ej.: Android 14, Chrome 140"
