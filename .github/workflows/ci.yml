name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # Falla si el modelo de EF Core cambió sin crear la migración correspondiente.
      - run: dotnet tool restore && dotnet ef migrations has-pending-model-changes --project src/Academy.Api --configuration Release --no-build
        env:
          ConnectionStrings__Academy: Host=localhost;Database=unused
      # Las pruebas de integración levantan PostgreSQL con Testcontainers (Docker viene preinstalado en el runner).
      - run: dotnet test --no-build --configuration Release

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
