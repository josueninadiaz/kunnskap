# Entorno local. Solo para desarrollo: las credenciales son públicas a propósito.
# Uso: docker compose up -d db
name: kunnskap-academy

services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: academy
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy_dev_only
    ports:
      - "127.0.0.1:${ACADEMY_DB_PORT:-5434}:5432"
    volumes:
      - academy-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d academy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  academy-db:
